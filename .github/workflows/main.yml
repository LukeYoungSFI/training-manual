---
#########################
#########################
## GitHub Demo Workflow #
#########################
#########################
name: Github Actions Workshop

#
# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#

#################################
# Start the job on dispatch     #
#################################
on:
  workflow_dispatch:

permissions: 
  contents: read

###############
# Set the Job #
###############
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      #uses: calls a MarketplaCE ACTION - THIS ONE CLONES YOUR REPO
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Explore the repo
        run: |
          echo "RUnner directory: $PWD"
          echo "Repository files:"
          find . -maxdepth 2 -type f | sort
